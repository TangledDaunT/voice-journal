[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice_journal"
version = "2.0.0"
description = "Local, always-on voice journal with batch processing architecture"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Shreyansh"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "onnxruntime>=1.16.0",
    "faster-whisper>=1.0.0",
    "librosa>=0.10.1",
    "requests>=2.31.0",
    "pyyaml>=6.0.1",
    "python-slugify>=8.0.1",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "loguru>=0.7.2",
    "pynput>=1.7.6",
    "plyer>=2.1.0",
    "noisereduce>=3.0.0",
    "pyrnnoise>=0.4.3",
    "psutil>=5.9.0",
    "resemblyzer>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
voice-journal = "daemon_v2:main"
voice-journal-mute = "utils.mute:main"
voice-journal-status = "status:main"
voice-journal-batch = "processing.batch_processor:run_batch_job"
voice-journal-calibrate = "speaker_id.embedding_speaker_id:main"

[project.urls]
Homepage = "https://github.com/shreyansh/voice_journal"
Documentation = "https://github.com/shreyansh/voice_journal#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
exclude = ["tests*", "test*", "*.test*"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
