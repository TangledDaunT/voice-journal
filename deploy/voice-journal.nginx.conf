# TLS terminates at the existing Cloudflare Tunnel. Keep dashboard Basic Auth.
limit_req_zone $binary_remote_addr zone=vj_audio:10m rate=50r/s;
server {
    listen 80;
    listen [::]:80;
    server_name voice.tangleddaunt.dpdns.org;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $voice_backend http://voice_journal_web:5000;
    client_max_body_size 100m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    location /api/microphone/ {
        limit_req zone=vj_audio burst=80 nodelay;
        add_header Cache-Control "no-store" always;
        proxy_pass $voice_backend;
    }
    location /api/stream {
        proxy_read_timeout 86400s;
        add_header X-Accel-Buffering no always;
        add_header Cache-Control "no-store" always;
        proxy_pass $voice_backend;
    }
    location / { proxy_pass $voice_backend; }
}
