# Docker Compose for Voice Journal
version: '3.8'

services:
  daemon:
    build: .
    container_name: voice_journal_daemon
    user: "0:0"
    volumes:
      - ${DATA_ROOT:?Set DATA_ROOT to the external disk mount, e.g. /mnt/voice-journal}:/data:rw
      - ./models:/app/models:ro
      - ./logs:/app/logs:rw
      - /dev/snd:/dev/snd
    environment:
      - DATA_ROOT=/data
      - TZ=Asia/Kolkata
    command: ["python", "daemon.py"]
    restart: unless-stopped
    healthcheck:
      disable: true
    # Resource limits - can be overridden in .env
    cpus: ${DAEMON_CPUS:-2.0}
    mem_limit: ${DAEMON_MEMORY:-2G}
    # reservations not directly supported; we can use minmum? ignore for now
    # we'll keep as limits only

  web:
    build: .
    container_name: voice_journal_web
    user: "0:0"
    volumes:
      - ${DATA_ROOT:?Set DATA_ROOT to the external disk mount, e.g. /mnt/voice-journal}:/data:rw
      - ./models:/app/models:ro
      - ./logs:/app/logs:rw
    environment:
      - DATA_ROOT=/data
      - TZ=Asia/Kolkata
    command: ["python", "web/app.py", "--host", "0.0.0.0", "--port", "5000"]
    ports:
      - "5000:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/days"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Resource limits - can be overridden in .env
    cpus: ${WEB_CPUS:-1.0}
    mem_limit: ${WEB_MEMORY:-1G}
    depends_on:
      - daemon
