# Docker Compose for Voice Journal
version: '3.8'

services:
  daemon:
    build: .
    container_name: voice_journal_daemon
    user: "0:0"
    group_add:
      - audio
    volumes:
      - ${DATA_ROOT}:/data:rw
      - ./models:/app/models:ro
      - ./logs:/app/logs:rw
      - ./config:/app/config:ro
    devices:
      - /dev/snd:/dev/snd
    environment:
      - DATA_ROOT=/data
      - TZ=Asia/Kolkata
      - AUDIO_SAMPLE_RATE=16000
      - AUDIO_CHANNELS=1
      - AUDIO_BLOCK_SIZE=512
    command: ["python", "daemon.py"]
    restart: unless-stopped
    healthcheck:
      disable: true
    cpus: ${DAEMON_CPUS:-2.0}
    mem_limit: ${DAEMON_MEMORY:-2G}

  web:
    build: .
    container_name: voice_journal_web
    user: "0:0"
    volumes:
      - ${DATA_ROOT}:/data:rw
      - ./models:/app/models:ro
      - ./logs:/app/logs:rw
      - ./web/dist:/app/web/dist:ro
    environment:
      - DATA_ROOT=/data
      - TZ=Asia/Kolkata
      - WEB_AUTH_TOKEN=${WEB_AUTH_TOKEN:-voice-journal-secret-2026}
    command: ["python", "web/app.py", "--host", "0.0.0.0", "--port", "5000"]
    ports:
      - "5000:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    cpus: ${WEB_CPUS:-1.0}
    mem_limit: ${WEB_MEMORY:-1G}
    depends_on:
      - daemon
