<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voice Journal</title>
    <style>
        :root { color-scheme: dark; font-family: system-ui, sans-serif; }
        body { margin: 0; background: #111827; color: #e5e7eb; }
        main { max-width: 1100px; margin: 0 auto; padding: 24px; }
        header, .day-header { display: flex; justify-content: space-between; gap: 16px; align-items: center; }
        h1, h2 { margin: 0; }
        button, select { background: #2563eb; color: white; border: 0; border-radius: 6px; padding: 9px 12px; cursor: pointer; }
        select { background: #1f2937; border: 1px solid #4b5563; }
        .panel { background: #1f2937; border-radius: 10px; padding: 18px; margin-top: 20px; }
        .days { display: grid; gap: 8px; margin-top: 14px; }
        .day { text-align: left; background: #374151; }
        .day.active { outline: 2px solid #60a5fa; }
        .meta { color: #9ca3af; font-size: 13px; margin-top: 5px; }
        audio { width: 100%; margin: 16px 0; }
        pre { white-space: pre-wrap; line-height: 1.55; font: inherit; margin: 0; }
        .empty, .error { color: #9ca3af; padding: 20px 0; }
        .error { color: #fca5a5; }
    </style>
</head>
<body>
<main>
    <header>
        <div>
            <h1>Voice Journal</h1>
            <div class="meta">Speech-only recording · Hindi and English auto-detected · no summaries</div>
        </div>
        <button onclick="loadDays()">Refresh</button>
    </header>
    <section class="panel">
        <div class="day-header">
            <h2>Daily recordings</h2>
            <select id="day-select" onchange="loadDay(this.value)"></select>
        </div>
        <div id="days" class="days"><div class="empty">Loading recordings…</div></div>
    </section>
    <section class="panel" id="journal" hidden>
        <div class="day-header">
            <h2 id="journal-date"></h2>
            <span class="meta" id="journal-meta"></span>
        </div>
        <audio id="audio" controls></audio>
        <pre id="transcript"></pre>
    </section>
    <div id="message" class="empty"></div>
</main>
<script>
let days = [];
async function loadDays() {
    const response = await fetch('/api/days');
    if (!response.ok) throw new Error('Unable to load daily recordings');
    days = await response.json();
    const list = document.getElementById('days');
    const select = document.getElementById('day-select');
    if (!days.length) {
        list.innerHTML = '<div class="empty">No speech has been recorded yet.</div>';
        select.innerHTML = '';
        return;
    }
    select.innerHTML = days.map(day => `<option value="${day.date}">${day.date}</option>`).join('');
    list.innerHTML = days.map(day => `
        <button class="day" data-day="${day.date}" onclick="loadDay('${day.date}')">
            ${day.date}<div class="meta">${Math.round(day.speech_seconds / 60)} minutes of speech · ${day.segment_count} segments</div>
        </button>`).join('');
    await loadDay(days[0].date);
}
async function loadDay(day) {
    const response = await fetch(`/api/days/${day}`);
    if (!response.ok) throw new Error('Unable to load this day');
    const journal = await response.json();
    document.getElementById('journal').hidden = false;
    document.getElementById('journal-date').textContent = journal.date;
    document.getElementById('journal-meta').textContent =
        `${Math.round(journal.speech_seconds / 60)} minutes · updated ${new Date(journal.updated_at).toLocaleString()}`;
    document.getElementById('audio').src = journal.audio_url;
    document.getElementById('transcript').textContent = journal.transcript || 'No transcript text returned.';
    document.querySelectorAll('.day').forEach(button => button.classList.toggle('active', button.dataset.day === day));
    document.getElementById('day-select').value = day;
}
loadDays().catch(error => document.getElementById('message').textContent = error.message);
</script>
</body>
</html>
