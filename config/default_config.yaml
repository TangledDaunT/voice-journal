# Voice Journal Configuration
# Updated for batch processing architecture (no real-time transcription)

# Audio Capture (Stage 1) - Still runs near-real-time
audio:
  sample_rate: 16000
  channels: 1
  block_size: 512
  ring_buffer_seconds: 30
  keep_audio: false
  audio_storage_path: "./audio_clips"

# VAD (Stage 2) - Runs near-real-time, segments stored for batch processing
vad:
  model_path: "./models/silero_vad.onnx"
  threshold: 0.6
  min_segment_duration: 0.5
  silence_padding: 0.3
  max_segment_duration: 30.0

# Speaker Calibration (Updated for embeddings)
speaker:
  calibration_file: "./config/voice_profiles.json"
  embedding_similarity_threshold: 0.75  # Cosine similarity threshold for speaker match

# ASR (Stage 4) - Stock Whisper with Hindi/English language guidance
asr:
  model_size: "large-v3"
  compute_type: "int8"
  device: "cpu"
  language: null  # Auto-detect Hindi/English
  beam_size: 5
  compression_ratio_threshold: 2.4
  no_repeat_ngram_size: 3
  repetition_penalty: 1.3
  vad_filter: true
  condition_on_previous_text: false  # Prevent hallucination cascade

  # Vocabulary biasing - only proper nouns that Whisper might mistranscribe
  # Add project names, recurring proper nouns, etc.
  initial_prompt: "Shreyansh, Shivangi. Use only Hindi and English; do not output any other language."

  # Confidence thresholds for flagging uncertain segments
  no_speech_prob_threshold: 0.6
  avg_logprob_threshold: -1.0

# Segment Merging (new stage between VAD and ASR)
segment_merging:
  # Merge consecutive VAD segments separated by less than this gap
  merge_gap_seconds: 2.5
  # Minimum duration for a transcription unit (don't send tiny clips to Whisper)
  min_transcription_unit_seconds: 5.0
  # Maximum duration for a transcription unit (split if needed)
  max_transcription_unit_seconds: 20.0  # Bound language-misdetection damage to a short span

# Conversation Grouping (Stage 5) - Coarser grouping for note boundaries
conversation:
  gap_seconds: 90
  min_segments: 2
  unknown_voice_ratio_threshold: 0.7
  rapid_alternation_threshold: 3.0

# LLM Classification (Stage 6)
llm:
  model: "qwen2.5:1.5b"  # Better multilingual/Hindi support than llama
  ollama_host: "http://localhost:11434"
  timeout_seconds: 45  # Slightly longer for 7B model if used
  max_retries: 2
  temperature: 0.2  # Slightly higher for classification tasks
  max_tokens: 600  # More tokens for nuanced analysis

# Transcript cleanup (Stage 6.5)
cleanup:
  enabled: true
  custom_dictionary: ["Shreyansh", "Shivangi", "Cupid", "MindBridge", "OpenClaw", "LegalLawAdvisor"]
  timeout_seconds: 45
  max_tokens: 1200
  estimated_seconds_per_conversation: 30

# Obsidian Output (Stage 7)
obsidian:
  vault_path: "./obsidian_vault"
  daily_notes_dir: "VoiceJournal/Daily"
  conversation_notes_dir: "VoiceJournal/Conversations"
  template_daily: null
  template_conversation: null

# Database (Stage 8)
database:
  path: "./data/voice_journal.db"
  enable_fts: true

# Dashboard audio playback (separate from raw staging retention)
dashboard:
  audio_cache_path: "./audio_cache"
  audio_retention_days: 30

# Daemon settings
daemon:
  log_level: "INFO"
  log_file: "./logs/voice_journal.log"
  mute_file: "./data/mute_flag"
  health_check_interval: 60

# Audio Preprocessing (new stage)
preprocessing:
  enable_denoising: true
  denoising_method: "noisereduce"  # or "rnnoise"
  gain_normalization: true
  target_db: -20.0  # Target loudness in dB
  min_rms_db_for_asr: -55.0  # Skip near-silent merged units before Whisper

# Batch Processing Scheduler (replaces real-time processing)
scheduler:
  # Run batch job when CPU load is below this threshold
  cpu_idle_threshold: 30.0  # Percentage
  # Minimum idle duration before starting batch job
  min_idle_duration_seconds: 60
  # Check idle status every N seconds
  idle_check_interval: 30

  # Guaranteed processing window (even if CPU is busy)
  # During this window, processing runs regardless of user activity
  # because you're assumed to be asleep
  guaranteed_window:
    start_hour: 22  # 10 PM
    end_hour: 6    # 6 AM
    enabled: true

  # Batch sizes: how much audio to process per scheduler invocation
  # Daytime batches are SMALL so processing backs off quickly if you return
  daytime_batch_hours: 0.5  # 30 min of audio (~1 min of processing)
  # Overnight batches are LARGER because full-CPU is fine when you're asleep
  overnight_batch_hours: 2.0  # 2 hours of audio (~4-5 min of processing)

  # Backlog overflow threshold - switch to faster model when exceeded
  backlog_overflow_hours: 24.0
  # Fallback model for overflow processing
  fallback_model: "distil-large-v3"
  fallback_compute_type: "int8"

# Backlog tracking (persisted in SQLite)
backlog:
  # Warn if backlog grows day-over-day
  warn_on_growth: true
  # Maximum hours to keep in staging before forced processing
  max_staging_hours: 72

# System settings
system:
  notify_on_mute: true
  hotkey_mute: "ctrl+shift+m"
